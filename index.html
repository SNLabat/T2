<script>
  const v = document.getElementById('v');
  let done = false;

  function scare() {
    if (done) return;
    v.muted = false;
    v.volume = 1;
    v.currentTime = 0;
    v.play().then(() => {
      done = true;
      v.classList.add('on');
      document.body.style.cursor = 'none';
    }).catch(() => { v.pause(); });  // blocked: stay black and wait for a click
  }

  // Try right away (works when the browser allows sound on load), otherwise on the first click or key
  if (v.readyState >= 2) scare(); else v.addEventListener('loadeddata', scare, { once: true });

  function onInteract() {
    if (done) return;
    const el = document.documentElement;
    try { const p = (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el); p?.catch?.(() => {}); } catch (e) {}
    scare();
  }
  addEventListener('pointerdown', onInteract);
  addEventListener('keydown', onInteract);
</script>
